
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockprice_backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - stockprice_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockprice_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - stockprice_network

networks:
  stockprice_network:
    driver: bridge
